[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.0",
    "fastapi[standard]>=0.157.0",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "opencv-python>=4.9.0.80",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=10.2.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.4.0",
    "sqlmodel>=0.0.48",
]

[project.optional-dependencies]
ai = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "crewai>=0.80.0",
    "langgraph>=0.2.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
